server.port=8080
spring.application.name=jev-support-desk

# Ollama 0.35+ serving a decision model on the same /v1/systemone protocol as Jev.
# The starter's auto-configuration is conditional on api-key; Ollama accepts any key,
# but the client needs a non-empty one.
spring.ai.typesafe.base-url=${TYPESAFE_BASE_URL:http://localhost:11434}
spring.ai.typesafe.api-key=${TYPESAFE_API_KEY:ollama}
# Ollama has no jev-latest: name a pulled model (nimble, tev1 or tev1:0.8b).
spring.ai.typesafe.model=${TYPESAFE_DEFAULT_MODEL:nimble}
# The first request loads the model. The retry budget must stay above the timeout,
# or no retry can ever fit in it.
spring.ai.typesafe.timeout=60s
spring.ai.typesafe.retry.total-timeout=150s

# Chat model that drafts the reply
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=${ANTHROPIC_MODEL:claude-sonnet-5}
spring.ai.anthropic.chat.max-tokens=1024

# Triage + draft the payouts ticket once at startup and log the results
supportdesk.demo.enabled=true
supportdesk.demo.ticket=Help! My payouts have been failing for 3 days.
