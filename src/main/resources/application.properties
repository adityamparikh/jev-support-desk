server.port=8080
spring.application.name=jev-support-desk

# Laya: a local laya-serve speaking the same /v1/systemone protocol as Jev.
# The starter's auto-configuration is conditional on api-key, and the client needs a
# non-empty one, so it defaults to the LAYA_API_KEY used in the README.
# Laya ignores non-Laya model names, so spring.ai.typesafe.model can stay at its default.
spring.ai.typesafe.base-url=${TYPESAFE_BASE_URL:http://localhost:8002}
spring.ai.typesafe.api-key=${TYPESAFE_API_KEY:local-test}

# Chat model that drafts the reply
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=${ANTHROPIC_MODEL:claude-sonnet-5}
spring.ai.anthropic.chat.max-tokens=1024

# Triage + draft the payouts ticket once at startup and log the results
supportdesk.demo.enabled=true
supportdesk.demo.ticket=Help! My payouts have been failing for 3 days.
